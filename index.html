// ─── HOOKS ───────────────────────────────────────────────
function useAutoCycle(n, ms = 3200, paused = false) {
  const [i, setI] = useState(0);
  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => setI(x => (x + 1) % n), ms);
    return () => clearInterval(t);
  }, [n, ms, paused]);
  return [i, setI];
}
