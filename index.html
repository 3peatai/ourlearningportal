// ─── HOOKS ───────────────────────────────────────────────────────────────────
function useAutoCycle(n, ms = 3200, paused = false) {
  const [i, setI] = useState(0);
  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => setI(x => (x + 1) % n), ms);
    return () => clearInterval(t);
  }, [n, ms, paused]);
  return [i, setI];
}

  const [sent, setSent] = useState(false);

    return () => { document.body.style.overflow = ''; };
  }, []);

  const onBackdrop = e => { if (e.target === e.currentTarget) onClose(); };

    try {
      await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...form, ...extra }),
      });

    setSent(true);

        </p>
        <form onSubmit={handleCallNext}>
          <div style={{ display:'flex', flexWrap:'wrap', gap:14 }}>
            <Field label="Company" half value={form.company} onChange={set('company')}/>
            <Field label="Title" half value={form.title} onChange={set('title')}/>

              <span style={{ color: C.aqua, minWidth: 18, marginTop: 2 }}><Icon name="pin" size={14}/></span>
              <div>
                <div style={{ fontFamily: 'Fraunces,serif', fontSize: 18, fontWeight: 400, color: C.paper }}>Hong Kong</div>
                <div style={{ color: 'rgba(244,237,224,.6)', marginTop: 2 }}>{COPY.contact.addressHK}</div>
              </div>
            </div>
            {/* Singapore */}
            <div style={{ display: 'flex', gap: 12 }}>
              <span style={{ color: C.aqua, minWidth: 18, marginTop: 2 }}><Icon name="pin" size={14}/></span>
              <div>
                <div style={{ fontFamily: 'Fraunces,serif', fontSize: 18, fontWeight: 400, color: C.paper }}>Singapore</div>
                <div style={{ color: 'rgba(244,237,224,.6)', marginTop: 2 }}>{COPY.contact.addressSG}</div>

            </div>

            {/* Bottom strip */}
            <div style={{ marginTop: 8, paddingTop: 18, borderTop: '1px solid rgba(244,237,224,.1)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8,
                fontFamily: 'JetBrains Mono,monospace', fontSize: 11, color: 'rgba(244,237,224,.55)', letterSpacing: 1 }}>
                <span>{COPY.domain}</span>
                <span>&#x00A9; 2026 · A BOUTIQUE STUDIO</span>

              <div style={{ marginTop: 12, fontSize: 11, color: 'rgba(244,237,224,.4)', lineHeight: 1.6, fontFamily: 'JetBrains Mono,monospace', letterSpacing: 0.4 }}>
                ourlearningportal.com brought to you by{' '}
                <a href="https://3peat.ai" target="_blank" rel="noopener noreferrer"
                  style={{ color: C.aqua, textDecoration: 'underline', textDecorationColor: 'rgba(127,198,192,.4)' }}>
                  3peat.ai
                </a>
                , a premier AI consultancy serving SMEs in Asia and Australia
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

// ─── ROOT ─────────────────────────────────────────────────────────────────────
const App = () => {
  const [isMobile, setIsMobile] = useState(
    typeof window !== 'undefined' && window.innerWidth < 768
  );
  const [modalOpen, setModalOpen] = useState(false);

  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  return (
    <MobileCtx.Provider value={isMobile}>
      <ModalCtx.Provider value={() => setModalOpen(true)}>
        <div style={{ position: 'relative', width: '100%', minHeight: '100%',
          fontFamily: 'Inter,sans-serif', color: C.ink, background: C.paper, overflow: 'hidden' }}>
          <Bg/>
          <div style={{ position: 'relative' }}>
            <Nav/>
            <Hero/>
            <BookingFlow/>
            <Modules/>
            <Demo/>
            <Reschedule/>
            <Invoicing/>
            <WhyUs/>
            <WhoFor/>
            <Footer/>
          </div>
          {modalOpen && <ContactModal onClose={() => setModalOpen(false)}/>}
        </div>
      </ModalCtx.Provider>
    </MobileCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
